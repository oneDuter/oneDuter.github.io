   <g id="text_1">
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(119.61 219.899662)">旧记忆</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(111.141562 244.922615)">S = [2, 4]</text>
   </g>
   <g id="text_2">
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(334.17 219.899662)">逐通道衰减</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(334.043437 244.922615)">A = [1.6, 2]</text>
   </g>
   <g id="text_3">
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(566.73 207.403443)">读取旧预测</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(576.225 232.426396)">k = [1, 0]</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(562.310156 257.418834)">预测值 = 1.6</text>
   </g>
   <g id="text_4">
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(799.29 219.816834)">修正后记忆</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(790.091719 245.005443)">S 新 = [2.3, 2]</text>
   </g>
   <g id="text_5">
    <text style="fill: #68788b; font: 16px 'Heiti TC', 'DejaVu Sans'; text-anchor: middle" x="262.548" y="321.421429" transform="rotate(-0 262.548 321.421429)">α = [0.8, 0.5]</text>
   </g>
   <g id="text_6">
    <text style="fill: #087f83; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(505.74375 321.915134)">目标 v = 3；误差 e = 3 − 1.6 = 1.4</text>
    <text style="fill: #087f83; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(508.677187 346.178571)">β = 0.5；只沿当前键方向写入 0.7</text>
   </g>
   <g id="text_7">
    <text style="fill: #142e47; font: 19px 'Heiti TC', 'DejaVu Sans'" transform="translate(275.918359 431.099617)">A = Diag(α) S 旧       e = v − Aᵀ k       S 新 = A + β k eᵀ</text>
    <text style="fill: #142e47; font: 19px 'Heiti TC', 'DejaVu Sans'" transform="translate(327.87 457.655383)">最后用当前查询 q 从更新后的 S 读取输出</text>
   </g>
  </g>
  <g id="text_8">
   <text style="fill: #142e47; font: 700 25px 'Heiti TC', 'DejaVu Sans'; text-anchor: start" x="35.28" y="52.65" transform="rotate(-0 35.28 52.65)">02  KDA：按误差修正记忆</text>
  </g>
  <g id="text_9">
   <text style="fill: #68788b; font: 14px 'Heiti TC', 'DejaVu Sans'; text-anchor: start" x="35.28" y="76.406875" transform="rotate(-0 35.28 76.406875)">教学例子：单头、两键通道、单值通道；忽略卷积与输出门。对应 Eq.1，p.4</text>
  </g>
