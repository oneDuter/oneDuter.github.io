   </g>
   <g id="text_5">
    <text style="fill: #68788b; font: 17px 'Heiti TC', 'DejaVu Sans'; text-anchor: middle" x="497.16" y="250.025603" transform="rotate(-0 497.16 250.025603)">另有 2 个共享专家直接处理全宽输入，与路由输出相加</text>
   </g>
   <g id="text_6">
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(140.175 335.620306)">QB：专家是否得到合理训练？</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(261.18 360.612743)"/>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(163.193906 387.000181)">8 token / 4 专家 / Top-1</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(139.694062 412.105962)">负载 [4,3,1,0] → 目标 [2,2,2,2]</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(117.18 437.0984)">通过统计分位数更新下一步路由偏置</text>
   </g>
   <g id="text_7">
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(595.016719 336.234978)">MoonEP：设备工作量是否相同？</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(729.72 361.227415)"/>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(603.72 386.359353)">将热门专家复制到空闲设备执行</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(576.72 411.434618)">相同权重的副本，梯度回收到原属设备</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(612.72 436.483728)">物理调度不增加逻辑专家数量</text>
   </g>
