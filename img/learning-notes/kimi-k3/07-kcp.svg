   <g id="text_1">
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(110.123437 185.349365)">设备 1：本地序列段</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(116.312344 212.630474)">独立计算 (M1, B1)</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(112.328437 237.622912)">S 出 = M1 S 入 + B1</text>
   </g>
   <g id="text_2">
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(417.923437 185.349365)">设备 2：本地序列段</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(424.112344 212.630474)">独立计算 (M2, B2)</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(420.128437 237.622912)">S 出 = M2 S 入 + B2</text>
   </g>
   <g id="text_3">
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(725.723437 185.349365)">设备 3：本地序列段</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(731.912344 212.630474)">独立计算 (M3, B3)</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(727.928437 237.622912)">S 出 = M3 S 入 + B3</text>
   </g>
   <g id="text_4">
    <text style="fill: #142e47; font: 19px 'Heiti TC', 'DejaVu Sans'" transform="translate(358.829609 339.820419)">有序前缀组合：(M₂M₁, M₂B₁ + B₂)</text>
    <text style="fill: #142e47; font: 19px 'Heiti TC', 'DejaVu Sans'" transform="translate(314 366.228934)">具有结合律，可并行组合；一般不具有交换律</text>
   </g>
   <g id="text_5">
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(320.34375 456.068491)">标量教学例子：段1 = 0.5S + 2；段2 = 0.8S + 1</text>
    <text style="fill: #142e47; font: 18px 'Heiti TC', 'DejaVu Sans'" transform="translate(330.540469 481.060929)">两段合成 = 0.4S + 2.6；初始 S=3 时输出 3.8</text>
   </g>
  </g>
  <g id="text_6">
   <text style="fill: #142e47; font: 700 25px 'Heiti TC', 'DejaVu Sans'; text-anchor: start" x="35.28" y="52.65" transform="rotate(-0 35.28 52.65)">07  KCP：每一段都是一个可组合的状态变换</text>
  </g>
  <g id="text_7">
   <text style="fill: #68788b; font: 14px 'Heiti TC', 'DejaVu Sans'; text-anchor: start" x="35.28" y="76.321563" transform="rotate(-0 35.28 76.321563)">KDA 不能只把各段从零产生的状态相加；还要传播对输入状态的变换，Eq.17，p.18</text>
  </g>
 </g>
